[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The repository is ANYmesh, but `anymesh` was already taken on PyPI, so the
# distribution and import package are `ANYmesher`/`anymesher`.
name = "ANYmesher"
version = "0.4.0"
description = "Native hybrid meshing for ANYgeometry shell and beam models"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [
  { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "ANYgeometry[planar]>=0.4,<0.5",
]

[project.optional-dependencies]
# Compatibility alias. Coplanar overlap preflight is fail-closed in every
# production mesh job, so the base ANYgeometry dependency now requests its
# planar capability directly.
planar = []
# The editor uses tkinter from the standard library, so it adds no wheel.  The
# extra exists so `pip install ANYmesher[gui]` is meaningful and stays
# meaningful if that ever stops being true.
gui = []
# A 3D mesh preview.  Kept separate from `gui` so the tables and controls are
# usable without pulling in a viewport.
gui3d = ["ANYtk3D>=0.2.1,<0.3"]
# Deprecated compatibility backend.  It is never selected automatically and
# remains outside the production dependency path.
gmsh = ["gmsh>=4.11"]
dev = [
  "build>=1.2",
  "pytest>=8",
  "twine>=5",
]

[project.scripts]
anymesher = "anymesher.__main__:main"

# A GUI entry point so no console window opens alongside the mesher.
[project.gui-scripts]
anymesher-gui = "anymesher.gui:main"

[project.urls]
Homepage = "https://github.com/audunarn/ANYmesh"
Repository = "https://github.com/audunarn/ANYmesh"
Issues = "https://github.com/audunarn/ANYmesh/issues"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "docs/LICENSE.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["anymesher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
# tests/conftest.py assigns a unique, gitignored repository-local basetemp so
# concurrent and interrupted Windows runs never contend for one directory.
addopts = ["-ra", "-p", "no:cacheprovider"]
