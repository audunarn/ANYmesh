name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          ref: c377c02f857cf8183ab70705cd67e9163b4ea8ca
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -e .ecosystem/ANYgeometry
      - run: python -m pip install -e ".[dev,planar]"
      - run: python -c "import anygeometry, anymesher; print(anygeometry.__version__, anymesher.__version__)"
      - run: python -m pytest

  native-absent:
    name: Disabled native boundary is absence-only
    runs-on: ubuntu-latest
    env:
      ANYMESHER_DISABLE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          ref: c377c02f857cf8183ab70705cd67e9163b4ea8ca
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -e .ecosystem/ANYgeometry
      - run: python -m pip install -e ".[dev]"
      - name: Prove absence-only fallback and strict native failure
        run: >-
          python -m pytest
          tests/test_packaging.py::test_disabled_native_build_is_absence_only -q

  gmsh:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          ref: c377c02f857cf8183ab70705cd67e9163b4ea8ca
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -e .ecosystem/ANYgeometry
      - run: python -m pip install -e ".[dev,gmsh,planar]"
      - name: Install Ubuntu Gmsh runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglu1-mesa
      - run: python -c "import gmsh"
      - run: python -m pytest

  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          ref: c377c02f857cf8183ab70705cd67e9163b4ea8ca
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
          CIBW_ENVIRONMENT: "ANYMESHER_REQUIRE_NATIVE=1"
          CIBW_BEFORE_TEST: >-
            python -m pip install --no-deps {project}/.ecosystem/ANYgeometry
          CIBW_TEST_COMMAND: >-
            python {project}/tools/release_wheel_smoke.py
            --expect-version 0.2.6 --require-native
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: anymesher-wheels-${{ runner.os }}
          path: dist/*.whl
