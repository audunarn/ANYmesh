name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          path: .ecosystem/ANYgeometry
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -e .ecosystem/ANYgeometry
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import anymesher; print(anymesher.__version__)"
      - run: python -m pytest

  # The gmsh backend is optional, so the suite has to pass both with and
  # without it.  Without this job the only configuration ever tested is the one
  # where every backend is present.
  gmsh:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          path: .ecosystem/ANYgeometry
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -e .ecosystem/ANYgeometry
      - run: python -m pip install -e ".[dev,gmsh]"
      - run: python -c "import gmsh"
      - run: python -m pytest

  # Build the compiled extension as distributable wheels on every supported
  # desktop platform.  The installed-wheel smoke below proves both clean
  # import and the compiled constrained-triangulation capability.
  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          path: .ecosystem/ANYgeometry
      - uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
          CIBW_ENVIRONMENT: "ANYMESHER_REQUIRE_NATIVE=1"
          CIBW_BEFORE_TEST: >-
            python -m pip install --no-deps {project}/.ecosystem/ANYgeometry
          CIBW_TEST_COMMAND: >-
            python -c "from pathlib import Path; import numpy as np; import anymesher;
            from anymesher.native_cpp import COMPILED_TRIANGULATION_AVAILABLE;
            from anymesher.triangulation import constrained_planar_triangulation;
            assert COMPILED_TRIANGULATION_AVAILABLE;
            root=Path(r'{project}').resolve(); module=Path(anymesher.__file__).resolve();
            assert root not in module.parents;
            points=np.asarray(((0.,0.),(1.,0.),(1.,1.),(0.,1.)),dtype=np.float64);
            result=constrained_planar_triangulation(points,(0,1,2,3),backend='native');
            assert result.actual_backend == 'anymesher-cpp17'; assert len(result.triangles)==2;
            print(anymesher.__version__, module, result.actual_backend)"
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: anymesher-wheels-${{ runner.os }}
          path: dist/*.whl
