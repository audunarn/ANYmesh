name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: audunarn/ANYgeometry
          ref: 6a8b023ef6f65805519c96b56e025b4e3b457a1f
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -e .ecosystem/ANYgeometry
      - run: python -m pip install -e ".[dev,planar]"
      - run: python -c "import anygeometry, anymesher; print(anygeometry.__version__, anymesher.__version__)"
      - run: python -m pytest

  native-absent:
    name: Disabled native boundary is absence-only
    runs-on: ubuntu-latest
    env:
      ANYMESHER_DISABLE_NATIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: audunarn/ANYgeometry
          ref: 6a8b023ef6f65805519c96b56e025b4e3b457a1f
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -e .ecosystem/ANYgeometry
      - run: python -m pip install -e ".[dev]"
      - name: Prove absence-only fallback and strict native failure
        run: >-
          python -m pytest
          tests/test_packaging.py::test_disabled_native_build_is_absence_only -q

  gmsh:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: audunarn/ANYgeometry
          ref: 6a8b023ef6f65805519c96b56e025b4e3b457a1f
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -e .ecosystem/ANYgeometry
      - run: python -m pip install -e ".[dev,gmsh,planar]"
      - name: Install Ubuntu Gmsh runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglu1-mesa
      - run: python -c "import gmsh"
      - run: python -m pytest

  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: audunarn/ANYgeometry
          ref: 6a8b023ef6f65805519c96b56e025b4e3b457a1f
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1.1
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_ENVIRONMENT: "ANYMESHER_REQUIRE_NATIVE=1"
          CIBW_BEFORE_TEST: >-
            python -m pip install --no-deps {project}/.ecosystem/ANYgeometry
          CIBW_TEST_COMMAND: >-
            python {project}/tools/release_wheel_smoke.py
            --expect-version 0.3.2 --require-native
        with:
          output-dir: dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anymesher-wheels-${{ runner.os }}
          path: dist/*.whl
