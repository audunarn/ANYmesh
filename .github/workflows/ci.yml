name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import anymesher; print(anymesher.__version__)"
      - run: python -m pytest

  # The gmsh backend is optional, so the suite has to pass both with and
  # without it.  Without this job the only configuration ever tested is the one
  # where every backend is present.
  gmsh:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gmsh]"
      - run: python -c "import gmsh"
      - run: python -m pytest

  # A wheel built from a clean checkout, installed on its own, importing
  # without the repository on sys.path.  Catches the packaging mistakes that an
  # editable install hides: a subpackage missing from the find directive, a
  # data file left out of MANIFEST.in.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: cd /tmp && python -c "import anymesher; print(anymesher.__version__)"
