name: Apply ANYgeometry 0.4 compatibility

on:
  push:
    branches:
      - anygeometry_0_4_compatibility
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: anygeometry_0_4_compatibility
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          ref: 069f22f3682ab97c89eb7824d53010c0b60dd575
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update package contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{old!r} not found in {path}')
              file.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace('pyproject.toml', 'version = "0.2.5"', 'version = "0.2.6"')
          replace('pyproject.toml', '"ANYgeometry[planar]>=0.3.0,<0.4"', '"ANYgeometry[planar]>=0.4.0,<0.5"')
          replace('src/anymesher/__init__.py', '__version__ = "0.2.5"', '__version__ = "0.2.6"')
          replace('tests/test_anygeometry_0_3_contract.py', 'test_anygeometry_0_3_hybrid_mesh_preserves_source_identity', 'test_anygeometry_0_4_hybrid_mesh_preserves_source_identity')
          replace('tests/test_anygeometry_0_3_contract.py', 'startswith("0.3.")', 'startswith("0.4.")')
          replace('tests/test_native_backend_defaults.py', '"0.2.5"', '"0.2.6"')

          packaging = Path('tests/test_packaging.py')
          text = packaging.read_text(encoding='utf-8')
          for old, new in (
              ('0_2_5', '0_2_6'),
              ('"0.2.5"', '"0.2.6"'),
              ('0.2.5', '0.2.6'),
              ('ANYgeometry[planar]>=0.3.0,<0.4', 'ANYgeometry[planar]>=0.4.0,<0.5'),
              ('c377c02f857cf8183ab70705cd67e9163b4ea8ca', '069f22f3682ab97c89eb7824d53010c0b60dd575'),
          ):
              if old not in text:
                  raise SystemExit(f'{old!r} not found in tests/test_packaging.py')
              text = text.replace(old, new)
          packaging.write_text(text, encoding='utf-8', newline='\n')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## 0.2.5 - 2026-08-22\n'
          entry = (
              '## 0.2.6 - 2026-08-25\n\n'
              '- Qualify the native hybrid mesher against ANYgeometry 0.4.0 while preserving\n'
              '  model identity, revision, stable associations, and the detached structural\n'
              '  preparation boundary.\n'
              '- Pin qualification to the published ANYgeometry 0.4.0 commit.\n\n'
          )
          if entry not in text:
              if marker not in text:
                  raise SystemExit('0.2.5 changelog marker missing')
              text = text.replace(marker, entry + marker)
          changelog.write_text(text, encoding='utf-8', newline='\n')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          needle = "ANYmesher uses ANYgeometry's exact public intersection query/plan/apply"
          if needle in text:
              text = text.replace(
                  needle,
                  "ANYmesher 0.2.6 is qualified against ANYgeometry 0.4.0 and uses ANYgeometry's exact public intersection query/plan/apply",
              )
          readme.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Recheck changed runtime contracts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".ecosystem/ANYgeometry[planar]"
          python -m pip install -e ".[dev,planar]"
          python -m pytest tests/test_anygeometry_0_3_contract.py tests/test_native_backend_defaults.py -q
      - name: Commit qualified compatibility update
        shell: bash
        run: |
          rm -rf .ecosystem
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml src/anymesher/__init__.py tests/test_anygeometry_0_3_contract.py tests/test_native_backend_defaults.py tests/test_packaging.py CHANGELOG.md README.md
          git commit -m 'fix: qualify ANYmesher against ANYgeometry 0.4'
          git push origin HEAD:anygeometry_0_4_compatibility
