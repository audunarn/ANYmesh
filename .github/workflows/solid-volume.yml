name: Solid volume candidate contracts

on:
  pull_request:
    paths:
      - '.github/workflows/solid-volume.yml'
      - 'src/anymesher/volume.py'
      - 'src/anymesher/_volume*.py'
      - 'tests/test_volume*.py'
      - 'tests/test_installed_volume_example.py'
      - 'tests/test_workflow2_native_operations.py'
      - 'examples/solid_volume_controlled.py'
      - 'tools/workflow2_windows_native.py'
      - 'pyproject.toml'
      - 'setup.py'
  workflow_dispatch:
    inputs:
      geometry_ref:
        description: Exact 40-character candidate ANYgeometry commit SHA
        required: true
        type: string

permissions:
  contents: read

env:
  # One immutable owner identity feeds both validation and checkout. Dispatch
  # always validates its supplied input; PRs use the locally tested candidate.
  CANDIDATE_GEOMETRY_REF: ${{ github.event_name == 'pull_request' && '28c359ed10d82bba7326d2d298e06aaa7077aa1b' || inputs.geometry_ref }}
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTEST_ADDOPTS: ''
  PYTEST_PLUGINS: ''
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONOPTIMIZE: '0'

jobs:
  candidate:
    name: Core owner/consumer (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        profile: [pure, native]
    env:
      ANYMESHER_DISABLE_NATIVE: ${{ matrix.profile == 'pure' && '1' || '0' }}
      ANYGEOMETRY_DISABLE_NATIVE: ${{ matrix.profile == 'pure' && '1' || '0' }}
      ANYMESHER_REQUIRE_NATIVE: ${{ matrix.profile == 'native' && '1' || '0' }}
      ANYGEOMETRY_REQUIRE_NATIVE: ${{ matrix.profile == 'native' && '1' || '0' }}
      ANYGEOMETRY_BUILD_NATIVE: ${{ matrix.profile == 'native' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Require an immutable owner candidate
        run: python -c "import os,re; assert re.fullmatch('[0-9a-f]{40}',os.environ['CANDIDATE_GEOMETRY_REF'])"
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          ref: ${{ env.CANDIDATE_GEOMETRY_REF }}
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYsolid
          ref: 06f3276d9207376316502aca651c3455db984104
          path: .ecosystem/ANYsolid
          persist-credentials: false
      - name: Build candidate owner and consumer wheels
        run: |
          python -m pip install build
          python -m build --outdir candidate-dist/geometry .ecosystem/ANYgeometry
          python -m build --outdir candidate-dist/solid .ecosystem/ANYsolid
          python -m build --outdir candidate-dist/mesh .
      - name: Install exact candidate artifacts
        run: python -c "import glob,subprocess,sys; wheels=glob.glob('candidate-dist/*/*.whl'); assert len(wheels)==3; subprocess.check_call([sys.executable,'-m','pip','install',*wheels,'pytest','scikit-fem==12.0.2'])"
      - name: Installed base imports stay independent
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_PROFILE: ${{ matrix.profile }}
        run: |
          python -I -c "import os,sys,importlib,importlib.util,pathlib,anygeometry,anymesher; native=os.environ['EXPECTED_PROFILE']=='native'; names=('anygeometry._core','anymesher._native'); assert not {'pytetwild','pyvista','vtk','anysolid','anysolver','ngsolve'}.intersection(sys.modules); assert all('site-packages' in pathlib.Path(m.__file__).parts for m in (anygeometry,anymesher)); assert (anygeometry.backend_info()['backend']=='native')==native; assert all((importlib.util.find_spec(n) is not None)==native for n in names); extensions=[importlib.import_module(n) for n in names] if native else []; assert all(pathlib.Path(m.__file__).suffix in ('.pyd','.so') for m in extensions); print(sys.executable,anygeometry.backend_info())"
      - name: Candidate owner geometry contracts
        working-directory: .ecosystem/ANYgeometry
        run: python -I -m pytest -q -o pythonpath= tests/test_solid_regions.py
      - name: Required compiled kernel operations
        if: matrix.profile == 'native'
        run: |
          python -I -m pytest -q -o pythonpath= tests/test_workflow2_native_operations.py --junitxml=native-kernels.xml
          python -I -c "import xml.etree.ElementTree as E; t=E.parse('native-kernels.xml'); cases=t.findall('.//testcase'); assert len(cases)==2; assert all(c.find(k) is None for c in cases for k in ('failure','error','skipped')); assert all(int(s.get(k,'0'))==0 for s in t.findall('.//testsuite') for k in ('failures','errors','skipped'))"
      - name: Installed consumer and controlled process contracts
        run: python -I -m pytest -q -o pythonpath= tests/test_volume_mesh.py tests/test_volume_process.py tests/test_volume_consumer.py tests/test_installed_volume_example.py --junitxml=volume-contracts.xml
      - run: python -m pip check
      - name: Retain candidate artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solid-volume-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.profile }}
          path: |
            candidate-dist/
            volume-contracts.xml
            native-kernels.xml

# This core-only lane deliberately does not replay frozen historical studies,
# replace existing native/full CI, or claim qualification of the real provider.
