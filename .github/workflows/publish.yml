name: Build release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish the manually built candidate to TestPyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sdist:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build --sdist
        env:
          ANYMESHER_REQUIRE_NATIVE: "1"
      - run: python -m twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-sdist
          path: dist/*.tar.gz

  wheels:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          ref: 97b06b0cfc72179c4f6522f9077d8a1d91911d61
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
          CIBW_ENVIRONMENT: "ANYMESHER_REQUIRE_NATIVE=1"
          CIBW_BEFORE_TEST: >-
            python -m pip install --no-deps {project}/.ecosystem/ANYgeometry
          CIBW_TEST_COMMAND: >-
            python {project}/tools/release_wheel_smoke.py
            --expect-version 0.3.2 --require-native
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-wheels-${{ runner.os }}
          path: dist/*.whl

  bundle:
    if: github.event_name == 'workflow_dispatch'
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-package-*
          path: dist/
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install twine
      - name: Validate complete release set
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import csv
          import email
          import hashlib
          import io
          import json
          import os
          import zipfile
          from pathlib import Path

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          root = Path("dist")
          sdist = root / "anymesher-0.3.2.tar.gz"
          wheels = sorted(root.glob("anymesher-0.3.2-*.whl"))
          if not sdist.is_file():
              raise SystemExit("missing exact ANYmesher 0.3.2 sdist")
          if len(wheels) != 12:
              raise SystemExit(f"expected 12 wheels, found {len(wheels)}")

          expected_pythons = {"cp311", "cp312", "cp313", "cp314"}
          platforms = {"Windows": [], "Linux": [], "macOS": []}
          for wheel in wheels:
              name = wheel.name
              if "-win_amd64.whl" in name:
                  platform = "Windows"
              elif "manylinux" in name and "x86_64" in name:
                  platform = "Linux"
              elif "macosx" in name:
                  platform = "macOS"
              else:
                  raise SystemExit(f"unexpected wheel platform: {name}")
              platforms[platform].append(name.split("-")[2])

          for platform, interpreters in platforms.items():
              if set(interpreters) != expected_pythons or len(interpreters) != 4:
                  raise SystemExit(
                      f"{platform} wheel matrix mismatch: {sorted(interpreters)}"
                  )

          expected_base_requirements = {
              ("numpy", ">=1.26", ()),
              ("anygeometry", "<0.5,>=0.4.1", ("planar",)),
          }
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  names = archive.namelist()
                  if len(names) != len(set(names)):
                      raise SystemExit(f"duplicate wheel member in {wheel.name}")
                  for name in names:
                      path = Path(name)
                      if path.is_absolute() or ".." in path.parts or "\\" in name:
                          raise SystemExit(f"unsafe wheel member {name!r} in {wheel.name}")
                  directory_members = [name for name in names if name.endswith("/")]
                  if any(archive.getinfo(name).file_size != 0 for name in directory_members):
                      raise SystemExit(
                          f"non-empty directory member in {wheel.name}: {directory_members}"
                      )
                  file_members = [name for name in names if not name.endswith("/")]
                  signatures = [
                      name for name in names if name.endswith((".jws", ".p7s"))
                  ]
                  if signatures:
                      raise SystemExit(
                          f"unexpected wheel signatures in {wheel.name}: {signatures}"
                      )
                  native_members = [
                      name
                      for name in names
                      if name.startswith("anymesher/")
                      and name.endswith((".pyd", ".so", ".dylib"))
                  ]
                  if len(native_members) != 1:
                      raise SystemExit(
                          f"expected one native library in {wheel.name}: {native_members}"
                      )
                  metadata_name, = [
                      name for name in names if name.endswith(".dist-info/METADATA")
                  ]
                  metadata = email.message_from_bytes(archive.read(metadata_name))
                  if metadata["Name"] != "ANYmesher" or metadata["Version"] != "0.3.2":
                      raise SystemExit(f"metadata identity mismatch in {wheel.name}")
                  base_requirements = set()
                  for raw in metadata.get_all("Requires-Dist", []):
                      requirement = Requirement(raw)
                      if requirement.marker is None:
                          base_requirements.add(
                              (
                                  canonicalize_name(requirement.name),
                                  str(requirement.specifier),
                                  tuple(sorted(requirement.extras)),
                              )
                          )
                  if base_requirements != expected_base_requirements:
                      raise SystemExit(
                          f"runtime requirements mismatch in {wheel.name}: "
                          f"{sorted(base_requirements)}"
                      )
                  record_name, = [
                      name for name in names if name.endswith(".dist-info/RECORD")
                  ]
                  rows = list(
                      csv.reader(io.StringIO(archive.read(record_name).decode("utf-8")))
                  )
                  if len(rows) != len(file_members):
                      raise SystemExit(
                          f"RECORD/member count mismatch in {wheel.name}: "
                          f"{len(rows)} != {len(file_members)}"
                      )
                  recorded = {row[0] for row in rows}
                  if recorded != set(file_members):
                      raise SystemExit(f"RECORD member set mismatch in {wheel.name}")
                  for member, encoded_hash, encoded_size in rows:
                      if member == record_name:
                          if encoded_hash or encoded_size:
                              raise SystemExit(
                                  f"RECORD self-row must be blank in {wheel.name}"
                              )
                          continue
                      data = archive.read(member)
                      expected_hash = "sha256=" + base64.urlsafe_b64encode(
                          hashlib.sha256(data).digest()
                      ).rstrip(b"=").decode("ascii")
                      if encoded_hash != expected_hash or encoded_size != str(len(data)):
                          raise SystemExit(
                              f"RECORD integrity mismatch for {member} in {wheel.name}"
                          )

          upload_files = [sdist, *wheels]
          records = []
          for path in upload_files:
              data = path.read_bytes()
              records.append(
                  {
                      "filename": path.name,
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  }
              )
          records.sort(key=lambda row: row["filename"])
          (root / "ANYmesher-0.3.2-SHA256SUMS.txt").write_text(
              "".join(f"{row['sha256']}  {row['filename']}\n" for row in records),
              encoding="ascii",
              newline="\n",
          )
          (root / "ANYmesher-0.3.2-release-manifest.json").write_text(
              json.dumps(
                  {
                      "schema": "anymesher.release-artifacts/1",
                      "distribution": "ANYmesher",
                      "version": "0.3.2",
                      "commit": os.environ["GITHUB_SHA"],
                      "upload_file_count": len(records),
                      "files": records,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ANYmesher-0.3.2-release-bundle
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ANYmesher-0.3.2-pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    needs: bundle
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ANYmesher
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ANYmesher-0.3.2-pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-production:
    name: Publish verified release assets to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ANYmesher
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download prebuilt GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          test "$RELEASE_TAG" = "v0.3.2"
          mkdir release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --pattern "ANYmesher-0.3.2-SHA256SUMS.txt"
      - name: Verify release checksums and select distributions
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import shutil
          from pathlib import Path

          source = Path("release-assets")
          checksum_path = source / "ANYmesher-0.3.2-SHA256SUMS.txt"
          if not checksum_path.is_file() or checksum_path.is_symlink():
              raise SystemExit("missing regular ANYmesher checksum asset")
          expected = {}
          for line in checksum_path.read_text(encoding="ascii").splitlines():
              digest, separator, filename = line.partition("  ")
              if not separator or len(digest) != 64 or Path(filename).name != filename:
                  raise SystemExit(f"malformed checksum row: {line!r}")
              if filename in expected:
                  raise SystemExit(f"duplicate checksum row: {filename}")
              expected[filename] = digest.lower()
          artifacts = sorted((*source.glob("*.whl"), *source.glob("*.tar.gz")))
          if not artifacts or set(expected) != {item.name for item in artifacts}:
              raise SystemExit("checksum manifest does not exactly cover distributions")
          sdists = [item for item in artifacts if item.name.endswith(".tar.gz")]
          wheels = [item for item in artifacts if item.name.endswith(".whl")]
          if [item.name for item in sdists] != ["anymesher-0.3.2.tar.gz"]:
              raise SystemExit("release must contain the exact ANYmesher sdist")
          if len(wheels) != 12:
              raise SystemExit(f"release must contain exactly 12 wheels, found {len(wheels)}")
          expected_pythons = {"cp311", "cp312", "cp313", "cp314"}
          platforms = {"Windows": [], "Linux": [], "macOS": []}
          for wheel in wheels:
              name = wheel.name
              if "-win_amd64.whl" in name:
                  platform = "Windows"
              elif "manylinux" in name and "x86_64" in name:
                  platform = "Linux"
              elif "macosx" in name:
                  platform = "macOS"
              else:
                  raise SystemExit(f"unexpected wheel platform: {name}")
              platforms[platform].append(name.split("-")[2])
          for platform, interpreters in platforms.items():
              if set(interpreters) != expected_pythons or len(interpreters) != 4:
                  raise SystemExit(
                      f"{platform} release wheel matrix mismatch: {sorted(interpreters)}"
                  )
          if any(
              item.name != "anymesher-0.3.2.tar.gz"
              and not (
                  item.name.startswith("anymesher-0.3.2-")
                  and item.name.endswith(".whl")
              )
              for item in artifacts
          ):
              raise SystemExit("unexpected ANYmesher distribution asset")
          target = Path("dist")
          target.mkdir()
          for artifact in artifacts:
              if not artifact.is_file() or artifact.is_symlink():
                  raise SystemExit(f"release asset is not a regular file: {artifact.name}")
              actual = hashlib.sha256(artifact.read_bytes()).hexdigest()
              if actual != expected[artifact.name]:
                  raise SystemExit(f"release checksum mismatch: {artifact.name}")
              shutil.copy2(artifact, target / artifact.name)
          PY
      - name: Publish exact distributions using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
